# n8n in queue mode: one main process (UI, webhooks), one worker, PostgreSQL for state, Redis for the job queue.
x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.78.1}
  restart: unless-stopped
  environment: &n8n-env
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/up.sh}
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run scripts/up.sh}
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_RUNNERS_ENABLED: "false"
    GENERIC_TIMEZONE: UTC
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/up.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4.1
    restart: unless-stopped
    user: redis
    # The job queue lives in Redis. noeviction makes a full Redis fail loudly instead of silently dropping queued jobs.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  n8n:
    <<: *n8n
    environment:
      <<: *n8n-env
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
    ports: ["127.0.0.1:5678:5678"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes: [n8ndata:/home/node/.n8n]

  worker:
    <<: *n8n
    command: worker
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes: [n8ndata:/home/node/.n8n]

  # docker compose --profile monitoring up -d --wait prometheus
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    depends_on:
      n8n: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  n8ndata:
